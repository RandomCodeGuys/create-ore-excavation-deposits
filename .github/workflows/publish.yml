name: Publish to Modrinth

# Tag-driven release: push `v0.2.0` (or any v* tag) → build + upload to Modrinth.
# The tag itself sets the version (gradle.properties::mod_version is overridden
# via -Pmod_version on the command line) so a single source of truth lives in git.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release writes the GitHub Release page, so the
      # job needs write access to repository contents.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build
        run: ./gradlew build -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Upload jar to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/coedeposits-${{ env.RELEASE_VERSION }}.jar
          generate_release_notes: true
