name: Publish Forge 1.20.1 to Modrinth

# Tag-driven release for the 1.20.1 line (Forge loader).
#
# Repo layout mirrors COE upstream: branches = MC versions, folders = loaders.
# This workflow lives on the `1.20.1` branch and ships the Forge/ subproject.
# The NeoForge 1.21.1 line is released by the workflow on `main`.
#
# Trigger conditions:
#   1. Tag matches `1.20.1-vX.Y.Z` — MC-PREFIXED. `main`/NeoForge owns the bare
#      `vX.Y.Z` tags (e.g. v0.1.5 already exists there), so the Forge 1.20.1 line
#      prefixes the MC version to keep tags unique in the shared repo. Matches the
#      Modrinth version number `1.20.1-X.Y.Z`. No pre-release suffix — bump
#      mod_version and push a clean `1.20.1-vX.Y.Z` when ready to ship.
#   2. Tag's commit is reachable from the 1.20.1 branch (enforced below).
#   3. Repo is the canonical RandomCodeGuys/create-ore-excavation-deposits —
#      forks can't trigger publish even if they push a matching tag.
#
# Forge 1.20.1 builds on JDK 17 (NOT 21 — that's the NeoForge 1.21.1 line).
# Fabric/ on this branch is a gradle skeleton (no publish config yet) and is
# intentionally NOT built here — add a Fabric block once it's a real port.
#
# Manual trigger via workflow_dispatch re-runs publication for an existing tag.
on:
  push:
    tags:
      - '1.20.1-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. 1.20.1-v0.1.5)"
        required: true
        type: string

jobs:
  publish:
    # Belt-and-suspenders: secrets don't propagate to forks anyway, but the
    # explicit gate keeps fork Actions tabs free of confusing red runs.
    if: github.repository == 'RandomCodeGuys/create-ore-excavation-deposits'
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release writes the GitHub Release page.
      contents: write
    steps:
      - name: Checkout (full history for branch-ancestry check)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag + version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          # Strip the "1.20.1-v" prefix → bare mod version (1.20.1-v0.1.5 → 0.1.5)
          echo "RELEASE_VERSION=${TAG##*v}" >> $GITHUB_ENV

      - name: Verify tag is on the 1.20.1 branch
        run: |
          git fetch origin 1.20.1 --depth=1000
          TAG_SHA=$(git rev-parse "${RELEASE_TAG}")
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/1.20.1; then
            echo "::error::Tag ${RELEASE_TAG} (${TAG_SHA}) is not reachable from the 1.20.1 branch."
            echo "::error::Tags for the Forge 1.20.1 line must point at commits on 1.20.1. Refusing to publish."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --- Forge subproject (the only published loader on this branch) ------
      - name: Make Forge gradlew executable
        run: chmod +x ./Forge/gradlew

      - name: Build Forge
        working-directory: ./Forge
        run: ./gradlew build -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Publish Forge to Modrinth
        working-directory: ./Forge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Upload Forge jar to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: Forge/build/libs/coedeposits-${{ env.RELEASE_VERSION }}.jar
          generate_release_notes: true
          # ALPHA mod (Modrinth type=ALPHA) — flag the GitHub release as a
          # pre-release too so it isn't surfaced as "Latest" / stable.
          prerelease: true
