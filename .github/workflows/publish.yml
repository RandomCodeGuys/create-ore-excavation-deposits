name: Publish to Modrinth

# Tag-driven release. Trigger conditions:
#   1. Tag matches strict semver vX.Y.Z (no -beta, -rc, -dev, -snapshot suffix).
#      Pre-release tags are intentionally excluded — bump mod_version and
#      push a clean vX.Y.Z when ready to ship.
#   2. Tag's commit is reachable from main (enforced in the job below).
#   3. Repo is the canonical RandomCodeGuys/create-ore-excavation-deposits —
#      forks can't trigger publish even if they push a matching tag.
#
# Per-loader build layout:
#   The repository is structured as <Loader>/ subprojects (NeoForge/, and
#   later Fabric/, Forge/). Each subproject has its own ./gradlew. The job
#   builds + publishes every subproject present in the branch. Releases
#   from a branch where only NeoForge/ exists ship only the NeoForge jar.
#
# Manual trigger via workflow_dispatch is also exposed for hotfix scenarios
# where a tag already exists and you want to re-run publication.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  publish:
    # Belt-and-suspenders: secrets don't propagate to forks anyway, but the
    # explicit gate keeps fork Actions tabs free of confusing red runs.
    if: github.repository == 'RandomCodeGuys/create-ore-excavation-deposits'
    runs-on: ubuntu-latest
    permissions:
      # softprops/action-gh-release writes the GitHub Release page.
      contents: write
    steps:
      - name: Checkout (full history for main-ancestry check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag + version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1000
          TAG_SHA=$(git rev-parse "${RELEASE_TAG}")
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
            echo "::error::Tag ${RELEASE_TAG} (${TAG_SHA}) is not reachable from main."
            echo "::error::Tags must point at commits on main. Refusing to publish."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # --- NeoForge subproject ----------------------------------------------
      - name: Make NeoForge gradlew executable
        if: hashFiles('NeoForge/gradlew') != ''
        run: chmod +x ./NeoForge/gradlew

      - name: Build NeoForge
        if: hashFiles('NeoForge/build.gradle') != ''
        working-directory: ./NeoForge
        run: ./gradlew build -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Publish NeoForge to Modrinth
        if: hashFiles('NeoForge/build.gradle') != ''
        working-directory: ./NeoForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Upload NeoForge jar to GitHub release
        if: hashFiles('NeoForge/build.gradle') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: NeoForge/build/libs/coedeposits-${{ env.RELEASE_VERSION }}.jar
          generate_release_notes: true

      # --- Fabric subproject (future — gated by hashFiles) -----------------
      - name: Make Fabric gradlew executable
        if: hashFiles('Fabric/gradlew') != ''
        run: chmod +x ./Fabric/gradlew

      - name: Build Fabric
        if: hashFiles('Fabric/build.gradle') != ''
        working-directory: ./Fabric
        run: ./gradlew build -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Publish Fabric to Modrinth
        if: hashFiles('Fabric/build.gradle') != ''
        working-directory: ./Fabric
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Upload Fabric jar to GitHub release
        if: hashFiles('Fabric/build.gradle') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: Fabric/build/libs/coedeposits-${{ env.RELEASE_VERSION }}.jar
          generate_release_notes: true

      # --- Forge subproject (older MC branches only) -----------------------
      - name: Make Forge gradlew executable
        if: hashFiles('Forge/gradlew') != ''
        run: chmod +x ./Forge/gradlew

      - name: Build Forge
        if: hashFiles('Forge/build.gradle') != ''
        working-directory: ./Forge
        run: ./gradlew build -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Publish Forge to Modrinth
        if: hashFiles('Forge/build.gradle') != ''
        working-directory: ./Forge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods -Pmod_version=${{ env.RELEASE_VERSION }}

      - name: Upload Forge jar to GitHub release
        if: hashFiles('Forge/build.gradle') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: Forge/build/libs/coedeposits-${{ env.RELEASE_VERSION }}.jar
          generate_release_notes: true
