plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'idea'
    // me.modmuss50.mod-publish-plugin — drives `./gradlew publishMods` to push the remapped jar
    // to Modrinth. Driven by .github/workflows/publish-fabric.yml on the 1.20.1 branch (token
    // from the repo secret MODRINTH_TOKEN).
    id 'me.modmuss50.mod-publish-plugin' version '0.7.4'
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    // ── Port-dep repos (mirror COE's Fabric/build.gradle on branch 1.20) ──────────
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } // COE / YACL / Xaero (Fabric)
    maven { url = 'https://maven.createmod.net' }                                // Create, Ponder, Flywheel
    maven { url = 'https://mvn.devos.one/releases/' }                           // Porting Lib (release)
    maven { url = 'https://mvn.devos.one/snapshots/' }                          // Porting Lib (snapshot)
    maven { url = 'https://maven.tterrag.com/' }                                // Registrate-fabric
    maven { url = 'https://maven.terraformersmc.com/' }                         // ModMenu
    maven { url = 'https://maven.quiltmc.org/repository/release/' }             // quilt-parsers (YACL's JiJ config dep, supplied to dev)
    maven { url = 'https://maven.blamejared.com' }                              // forge-config-api-port (fuzs)
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } // forge-config-api-port (fuzs mirror)
    maven { url = 'https://maven.shedaniel.me/' }                               // (Registrate transitive / cloth)
    maven { url = 'https://maven.architectury.dev/' }                           // Architectury (Registrate-fabric transitive)
    maven { url = 'https://raw.githubusercontent.com/tom5454/maven/main' }      // ChunkStorageFabric (COE OreData backend)
    maven {
        url = 'https://maven.jamieswhiteshirt.com/libs-release'                 // reach-entity-attributes (Porting-Lib transitive)
        content { includeGroup 'com.jamieswhiteshirt' }
    }
    maven { url = 'https://maven.ladysnake.org/releases' }                      // (Porting-Lib transitive: cardinal-components etc.)
    maven { url = 'https://maven.cafeteria.dev/releases' }                      // (Porting-Lib transitive)
    maven { url = 'https://modmaven.dev' }                                      // (Create-fabric transitive fallback)
    maven {
        url = 'https://www.cursemaven.com'                                      // forge-config-api-port (curse fallback)
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // ── Forge Config API Port (Fabric) — provides net.minecraftforge.common.ForgeConfigSpec ──
    // Config.java / ClientConfig.java compile against ForgeConfigSpec verbatim; this dep makes
    // that API exist on Fabric. night-config is its TOML backend (COE lists it explicitly too).
    implementation "com.electronwill.night-config:core:3.6.3"
    implementation "com.electronwill.night-config:toml:3.6.3"
    modImplementation "curse.maven:forge-config-api-port-fabric-547434:${forge_config_api_port_file}"

    // ── Create 6.0 stack (Fabric) — COE 1.6.x requires create [6.0,) ─────────────
    modImplementation("com.simibubi.create:create-fabric:${create_version}") {
        exclude(group: 'net.fabricmc.fabric')
    }
    for (String m in port_lib_modules.split(',')) {
        modApi "io.github.fabricators_of_create.Porting-Lib:$m:$port_lib_version"
    }
    modImplementation("dev.engine-room.flywheel:flywheel-fabric-${flywheel_minecraft_version}:${flywheel_version}") {
        exclude(group: 'net.fabricmc.fabric')
    }
    modImplementation("net.createmod.ponder:Ponder-Fabric-1.20.1:${ponder_version}") {
        exclude(group: 'net.fabricmc.fabric')
    }
    // Registrate (Fabric) — Create's registration lib; pulled in by Create at runtime.
    modImplementation("com.tterrag.registrate_fabric:Registrate:1.3.62-MC1.20.1") {
        exclude(group: 'io.github.fabricators_of_create') // avoid duplicate Porting Lib
        exclude(group: 'net.fabricmc')
    }
    // Architectury — Registrate-fabric transitive at runtime.
    modImplementation("dev.architectury:architectury-fabric:9.1.12")

    // ── coedeposits' own integration / soft deps ─────────────────────────────────
    // COE (host mod): compile against its API + run with it in dev, but never bundle it.
    modCompileOnly "maven.modrinth:create-ore-excavation:${coe_version}"
    modLocalRuntime "maven.modrinth:create-ore-excavation:${coe_version}"
    // ChunkStorage — COE Fabric's OreData backend (OreDataCapability.OreData implements
    // com.tom.chunkstorage.api.DataObject). On the COMPILE classpath so javac can
    // type-check our OreData reads/writes.
    modCompileOnly("com.tom5454.chunkstorage:ChunkStorageFabric-120:1.0.4") {
        exclude(group: 'net.fabricmc.fabric-loader')
    }
    // ...and at DEV RUNTIME too. COE itself is modLocalRuntime (above), but the Modrinth
    // COE artifact ships no POM to pull ChunkStorage transitively, so runClient/runServer
    // crash in COE's OreDataCapability.<clinit> with
    // NoClassDefFoundError com/tom/chunkstorage/api/DataObject before our mod even loads.
    // Dev-only — never compiled in or shipped; prod users get ChunkStorage through COE's
    // own dependency chain / jar-in-jar.
    modLocalRuntime("com.tom5454.chunkstorage:ChunkStorageFabric-120:1.0.4") {
        exclude(group: 'net.fabricmc.fabric-loader')
    }

    // Dev/test mod loaded into runClient only — not a compile dep, not shipped. Create:
    // Steam 'n' Rails (a Create addon). PEA8dAwJ = 1.7.2 Fabric 1.20.1 (C6 build, matches
    // Create 6.x). Requires Create (already a dep above); Modrinth artifacts carry no POM,
    // so nothing transitive is pulled.
    modLocalRuntime "maven.modrinth:create-steam-n-rails:PEA8dAwJ"

    // YACL — the in-game config screen + deposit editor (reached via ModMenu).
    // OPTIONAL (fabric.mod.json "suggests"), but kept in the DEV runtime so the config
    // menu is testable in runClient.
    modImplementation "maven.modrinth:yacl:${yacl_version}"
    // ModMenu — surfaces the YACL config screen (CoedepositsModMenu).
    modImplementation("com.terraformersmc:modmenu:${modmenu_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
    // YACL JiJ-bundles org.quiltmc.parsers (gson + json) for its config (de)serializer,
    // and Loom doesn't unpack a dependency mod's nested JiJ in dev — so YACL's own client
    // entrypoint otherwise crashes runClient with
    // NoClassDefFoundError org/quiltmc/parsers/json/gson/GsonWriter. Supply the exact
    // version (0.2.1) YACL bundles to the dev runtime. Dev-only — not bundled/shipped
    // (prod users get it via YACL's own JiJ). The imageio/TwelveMonkeys jars YACL also
    // bundles are lazy (image widgets only — the deposit editor has none).
    runtimeOnly "org.quiltmc.parsers:gson:0.2.1"
    runtimeOnly "org.quiltmc.parsers:json:0.2.1"
    // Xaero's World Map — the world-map overlay target (closed-source, OPTIONAL:
    // fabric.mod.json lists it under "suggests"). COMPILE classpath always, for the
    // GuiMapAccessor @Accessor + the ScreenEvents GuiMap reference.
    modCompileOnly "maven.modrinth:xaeros-world-map:${xaero_world_map_version}"

    // DEV-ONLY: load Xaero's World Map into runClient so the deposit overlay (and Create's own
    // train-map) can be tested in dev. PINNED to WorldMap 1.39.12 (xaero_world_map_version) — the
    // last release before Xaero moved its shared classes (ScreenBase etc.) into xaerolib. 1.40.x
    // breaks Create's bundled Xaero compat (Create bug #9770 — ClassNotFoundException
    // xaero.map.gui.ScreenBase) which crashes the whole GuiMap render. 1.39.12 is self-contained
    // (no JiJ'd xaerolib to supply separately) and still ships xaero.map.gui.ScreenBase, so BOTH
    // Create's train-map and our overlay work.
    //
    // Supplied as a files() artifact, NOT the modCompileOnly maven coord above: a coord that sits
    // in both compileOnly and localRuntime gets remapped for compile but stays at INTERMEDIARY on
    // the runtime side (→ NoSuchFieldError in GuiMap). A separate files() jar is remapped to the
    // named dev mappings independently. Copy it from the Gradle modules cache
    // (maven.modrinth/xaeros-world-map/1.39.12_Fabric_1.20) into libs/ (gitignored, NOT shipped).
    // Guarded so a checkout without it still builds; runClient just lacks Xaero then.
    def xaeroMapDevJar = file('libs/xaeros-world-map-1.39.12_Fabric_1.20.jar')
    if (xaeroMapDevJar.exists()) {
        modLocalRuntime files(xaeroMapDevJar)
    } else {
        logger.warn('[coedeposits] Fabric/libs/xaeros-world-map-1.39.12_Fabric_1.20.jar missing — Xaero World Map NOT added to runClient. Copy it from the Gradle modules cache to enable the overlay in dev.')
    }

    // findbugs jsr305 — @Nullable used by platform-shared/pack/BundledRecipePack.java.
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

// ── Shared loader-agnostic core (mirrors COE's Fabric srcDir of ../Forge/src/platform-shared) ──
// The PLATFORM-SHARED network/** is excluded: those classes use Forge
// SimpleChannel/NetworkEvent APIs that don't exist on Fabric. The Fabric module
// supplies its own uk.niknik.coedeposits.network.* (same package + same public
// signatures the callers use) under src/main/java; the wire-only DepositSnapshot
// is re-provided there too (it has no Forge refs).
//
// NOTE: a plain `java { exclude '**/network/**' }` would also drop the Fabric
// module's OWN network package (the exclude pattern is matched against every
// source root). So instead we exclude on compileJava by ABSOLUTE path — only
// files under ../Forge/src/platform-shared/.../network/ are removed, leaving the
// Fabric network classes intact.
sourceSets {
    main {
        java {
            srcDir '../Forge/src/platform-shared/java'
        }
        resources {
            srcDir '../Forge/src/platform-shared/resources'
        }
    }
}

def sharedNetworkDir = file('../Forge/src/platform-shared/java/uk/niknik/coedeposits/network').canonicalFile
def excludeSharedNetwork = { fte -> fte.file.canonicalFile.toPath().startsWith(sharedNetworkDir.toPath()) }
tasks.named('compileJava').configure {
    exclude excludeSharedNetwork
}
// withSourcesJar() collects from BOTH source roots, so the platform-shared
// network/*.java collide with the Fabric module's own copies. Drop the shared
// (Forge-only) network sources from the sources jar to avoid the duplicate, and
// belt-and-braces set a duplicates strategy in case ordering ever changes.
tasks.named('sourcesJar').configure {
    exclude excludeSharedNetwork
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    // Loom auto-generates the runClient / runServer tasks. In IntelliJ the Fabric client
    // appears as the run config "coedeposits-fabric-1.20 [runClient]" — the Fabric counterpart
    // to Forge's runClient (Forge/build.gradle minecraft { runs { client } }).
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 17
}

// ---- Modrinth publishing (Fabric 1.20.1) ------------------------------------
// `./gradlew publishMods` uploads the remapped jar to the SAME Modrinth project as the
// Forge/NeoForge lines. Driven by .github/workflows/publish-fabric.yml on the 1.20.1 branch
// (MODRINTH_TOKEN from the repo secret). Release flow: bump mod_version, update CHANGELOG.md,
// then `git tag 1.20.1-fabric-vX.Y.Z && git push origin 1.20.1-fabric-vX.Y.Z`.
publishMods {
    // Loom's remapJar is the shippable (intermediary-remapped) artifact — NOT tasks.jar.
    file = tasks.remapJar.archiveFile

    // Modrinth version_number must be UNIQUE per project. Forge 1.20.1 ships "1.20.1-X.Y.Z" and
    // NeoForge ships "X.Y.Z" to this same project, so the Fabric line appends "-fabric" → e.g.
    // "1.20.1-0.1.6-fabric". mod_version itself is untouched.
    version = "${minecraft_version}-${mod_version}-fabric"
    displayName = "[Fabric ${minecraft_version}] Create Ore Excavation Deposits ${mod_version}"

    // Latest CHANGELOG.md entry — repo root, one level up from this Fabric/ subproject.
    changelog = providers.provider {
        def f = file('../CHANGELOG.md')
        if (!f.exists()) return "See https://github.com/RandomCodeGuys/create-ore-excavation-deposits/commits/1.20.1 for changes."
        def text = f.text
        def matcher = text =~ /(?s)## .*?(?=\n## |\z)/
        return matcher.find() ? matcher.group(0).trim() : text
    }

    // ALPHA while the 1.20.1 line is still iterating.
    type = ALPHA
    modLoaders.add("fabric")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        // Same project as Forge/NeoForge — the "-fabric" version suffix keeps them distinct.
        projectId = "XfN8l56o"
        minecraftVersions.add(minecraft_version)  // 1.20.1

        requires { slug = "create-ore-excavation" }
        requires { slug = "fabric-api" }
        optional { slug = "xaeros-world-map" }
        optional { slug = "xaeros-minimap" }
        optional { slug = "yacl" }
    }
}
