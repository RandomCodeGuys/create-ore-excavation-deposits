buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        // MixinGradle — registers coedeposits.mixins.json with FML in BOTH the
        // published manifest (MixinConfigs) and the dev runClient/runServer mixin
        // env. Forge 1.20.1 does NOT pick up mods.toml [[mixins]] in dev — the
        // dep mods (Create/Xaero) use the MixinConfigs manifest; COE uses MixinGradle.
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    // me.modmuss50.mod-publish-plugin — drives `./gradlew publishMods` to push the
    // built (reobf'd) Forge jar to Modrinth. Used by .github/workflows/publish.yml
    // on the 1.20.1 branch. Mirrors the NeoForge line's release plumbing.
    id 'me.modmuss50.mod-publish-plugin' version '0.7.4'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // Official Mojang mappings — always resolvable, no external mappings repo.
    // (Matches COE's Fabric loom.officialMojangMappings(); param names don't matter
    // for the port since we write our own.) Parchment can be re-added later for dev.
    mappings channel: 'official', version: minecraft_version

    // No access transformer yet.

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Remap the dependency mods' production SRG mixin refmaps to the dev
            // (official-mapped) runtime at load. Without this, Create/YACL/COE/Xaero
            // mixins crash ("could not find target m_xxxxx_"). The SRG→official map
            // is generated by ForgeGradle's createSrgToMcp task.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        // Second dev client for two-player testing (reveal_scope / sharing / team reveal).
        // FG6 only injects the launch main-class into runs that inherit a configured run, so
        // this MUST `parent` the client run — a from-scratch run dies with "No main class
        // specified". Inherits client's mixin-refmap props; overrides only the working dir (its
        // own run2/) + a distinct offline username, so the default "Dev" client can Open-to-LAN
        // and "Dev2" joins via Direct Connect → localhost:<port>. Generates the `runClient2` task.
        client2 {
            parent project.minecraft.runs.getByName('client')
            workingDirectory project.file('run2')
            args '--username', 'Dev2'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '--nogui'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

// ── GuiMapMixin refmap (HAND-WRITTEN: src/main/resources/coedeposits.refmap.json) ──
// The overlay mixin injects into Xaero's GuiMap.init/render (vanilla Screen
// overrides). In a PRODUCTION (SRG) runtime those are m_7856_/m_88315_, so the
// mixin needs a refmap. The Mixin AP can't auto-generate one here — it fails to
// walk GuiMap→ScreenBase→Screen across the official↔SRG boundary (Xaero is a mod,
// not SRG-mapped): "Superclass Screen not found in hierarchy". So the refmap is
// HAND-WRITTEN with the two SRG names verified from build/createSrgToMcp/output.srg:
//   init   → m_7856_()V
//   render → m_88315_(Lnet/minecraft/client/gui/GuiGraphics;IIF)V
// Referenced from coedeposits.mixins.json. In DEV the runs block above remaps it
// back to official via output.srg (same path the dep mods' searge refmaps take),
// so the overlay resolves in both runtimes. The @Shadow fields are Xaero's OWN
// (not SRG-remapped) → no refmap entry needed.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Loader-agnostic core lives in platform-shared/, compiled into this Forge module
// and (later) srcDir'd into the Fabric module — mirrors COE's structure. Forge
// "owns" platform-shared for the 1.20.1 line.
sourceSets {
    main {
        java { srcDir 'src/platform-shared/java' }
        resources { srcDir 'src/platform-shared/resources' }
    }
}

// MixinGradle: register coedeposits.mixins.json (manifest + dev runClient/runServer).
// 'config' only — no 'add'/AP refmap generation (the AP can't resolve GuiMapMixin's
// Xaero GuiMap→ScreenBase→Screen hierarchy across the official↔SRG boundary). DEV
// (official mappings) needs no refmap — the mixin injects into Xaero's official-named
// methods directly. PRODUCTION still needs a refmap (documented TODO in the runs block).
mixin {
    config 'coedeposits.mixins.json'
}

repositories {
    // Modrinth maven — serves COE, YACL, Xaero's World Map as production jars.
    // On Forge 1.20.1 these are SRG-mapped, so each mod dep is wrapped in
    // fg.deobf(...) below to remap it to the official mappings we compile against.
    // NOTE: a plain maven with `content { includeGroup }` (NOT exclusiveContent) —
    // fg.deobf produces the remapped `..._mapped_official` artifact in ForgeGradle's
    // own local repo under the SAME `maven.modrinth` group, and exclusiveContent
    // would forbid resolving it from anywhere but the remote.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    // Create 6.0 stack — content-filtered so they're never queried for maven.modrinth:*
    // (an unfiltered maven here breaks ForgeGradle's deobf staging for the Modrinth deps).
    maven {
        url = "https://maven.createmod.net"   // Create, Ponder, Flywheel (1.0+)
        content {
            includeGroupByRegex "com\\.simibubi\\..*"
            includeGroupByRegex "net\\.createmod\\..*"
            includeGroupByRegex "dev\\.engine-room\\..*"
        }
    }
    maven {
        url = "https://maven.tterrag.com"     // Registrate
        content { includeGroupByRegex "com\\.tterrag\\..*" }
    }
    // MixinExtras (Create's mixin lib) — plain library, not MC-mapped. Content-filtered
    // so Maven Central is never queried for the deobf Modrinth/Create deps.
    mavenCentral {
        content { includeGroupByRegex "io\\.github\\.llamalad7.*" }
    }
    // KubeJS + Rhino (OPTIONAL script integration) — Latvian's maven, content-filtered
    // so it's never queried for the deobf Modrinth/Create deps.
    maven {
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    // Architectury API — KubeJS's multiloader base (its API types appear in KubeJSPlugin signatures).
    maven {
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ── Create 6.0 stack for MC 1.20.1 — COE 1.6.5 requires create [6.0.2,) ─────────
    // Create 6.0 uses decoupled versioning (6.0.x ships for 1.20.1 too) with the new
    // dev.engine-room.flywheel + a standalone net.createmod.ponder — all PUBLISHED, so
    // (unlike the old 0.5.1 jarJar-only libs) they pull cleanly as deobf deps. Versions
    // mirror COE's own 1.20 branch: create 6.0.7-281 / flywheel 1.0.5 / ponder 1.0.91 /
    // registrate MC1.20-1.3.3. ':slim' Create = no jarJar (we supply the libs ourselves).
    // implementation = compile + dev-runtime, NOT bundled (reobf only touches our own
    // classes). transitive = false: deobf'd jars have no POM, so a transitive resolve
    // trips ForgeGradle's deobf repo — we list every needed mod explicitly anyway.
    implementation(fg.deobf("com.simibubi.create:create-${minecraft_version}:6.0.7-281:slim")) { transitive = false }
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:1.0.91")) { transitive = false }
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:1.0.5")) { transitive = false }
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:1.0.5")) { transitive = false }
    implementation(fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")) { transitive = false }

    // MixinExtras 0.4.1 — Create 6.0.7 jarJars it (mixinextras-forge-0.4.1.jar) for its
    // @WrapOperation/@ModifyExpressionValue mixins, but ':slim' Create excludes the jarJar.
    // Plain library (no MC refs) → NO fg.deobf. Without it: ClassNotFoundException on
    // com.llamalad7.mixinextras.injector.wrapoperation.Operation during Create's mixin apply.
    runtimeOnly "io.github.llamalad7:mixinextras-forge:0.4.1"

    // ── COE (host mod) + soft client deps. Same scope: compile + dev-runtime, unbundled.
    //   COE   9mCy0ePP = 1.20.1-1.6.5 (forge, requires create 6.0.2+)
    //   YACL  sCWgXDYQ = 3.6.6+1.20.1-forge    Xaero 5mJcHKn6 = forge-1.20.1-1.40.16
    implementation(fg.deobf("maven.modrinth:create-ore-excavation:9mCy0ePP")) { transitive = false }
    implementation(fg.deobf("maven.modrinth:yacl:sCWgXDYQ")) { transitive = false }
    implementation(fg.deobf("maven.modrinth:xaeros-world-map:5mJcHKn6")) { transitive = false }

    // Dev/test mod loaded into runClient only — not a compile dep, not bundled (runtimeOnly).
    // Mirrors the NeoForge line's Cubes Without Borders. QzVMYIfG = 3.0.0+1.20 (forge), the
    // build Modrinth lists under 1.20.1.
    runtimeOnly(fg.deobf("maven.modrinth:cubes-without-borders:QzVMYIfG")) { transitive = false }

    // ── Dev-runtime ONLY test mods (runClient / runClient2) — exercise the 0.2.0 feature
    //   surface in-game. Not compile deps, not bundled (runtimeOnly, like cubes above).
    //   OPAC      BOfbzRMc = forge-1.20.1-0.27.5 → backs reveal_scope: TEAM (parties path).
    //             TeamBridge resolves OPAC → FTB Teams → vanilla scoreboard; OPAC + a vanilla
    //             `/team` cover two of the three branches (FTB Teams isn't on Modrinth maven —
    //             drop its jar into run/mods by hand to exercise the FTB branch).
    //   COE-Plus  WHvecoEX = 0.2.3 → ships its own COE veins with no coedeposits deposit_type,
    //             so the auto-adopt path (auto_adopt_coe_veins) has real foreign veins to adopt.
    runtimeOnly(fg.deobf("maven.modrinth:open-parties-and-claims:BOfbzRMc")) { transitive = false }
    runtimeOnly(fg.deobf("maven.modrinth:create-ore-excavation-plus:WHvecoEX")) { transitive = false }

    // KubeJS at DEV RUNTIME too (the compileOnly trio below only puts the plugin classes on the
    // compile classpath) — so the CoeDeposits binding actually loads in runClient and
    // `CoeDeposits.add(...)` is testable. KubeJS needs Rhino + Architectury at runtime as well.
    runtimeOnly(fg.deobf("dev.latvian.mods:kubejs-forge:2001.6.5-build.26")) { transitive = false }
    runtimeOnly(fg.deobf("dev.latvian.mods:rhino-forge:2001.2.2-build.17")) { transitive = false }
    runtimeOnly(fg.deobf("dev.architectury:architectury-forge:9.1.12")) { transitive = false }

    // ── KubeJS — OPTIONAL script integration (kubejs/* plugin + CoeDeposits binding) ─────
    // compileOnly: players supply KubeJS at runtime; the plugin is discovered (via
    // kubejs.plugins.txt) only when KubeJS is installed, so the mod loads fine without it.
    // KubeJS 2001.6.5 (1.20.1) needs Rhino 2001.2.2 + Architectury 9.1.12 on the COMPILE
    // classpath (KubeJSPlugin's method signatures + BindingsEvent's Scriptable reference them).
    // transitive=false — deobf jars have no resolvable POM in ForgeGradle staging; listed explicitly.
    compileOnly(fg.deobf("dev.latvian.mods:kubejs-forge:2001.6.5-build.26")) { transitive = false }
    compileOnly(fg.deobf("dev.latvian.mods:rhino-forge:2001.2.2-build.17")) { transitive = false }
    compileOnly(fg.deobf("dev.architectury:architectury-forge:9.1.12")) { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var props = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// ---- Modrinth publishing (Forge 1.20.1) -------------------------------------
// `./gradlew publishMods` uploads build/libs/coedeposits-<ver>.jar (reobf'd) to
// the SAME Modrinth project as the NeoForge line, tagged loader=forge /
// MC=1.20.1. Driven by .github/workflows/publish.yml on the 1.20.1 branch
// (MODRINTH_TOKEN from the repo secret). Release flow: bump mod_version, update
// CHANGELOG.md, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
publishMods {
    file = tasks.jar.archiveFile  // ForgeGradle reobfs the jar task in place

    // Modrinth version_number must be UNIQUE per project — and the NeoForge 1.21.1
    // line ships to this same project at the same mod_version, so prefix the MC
    // version. Mirrors upstream COE's scheme ("1.20.1-1.6.5" vs "1.21.1-1.6.5"):
    // the mod's own version (mod_version) is untouched; only the Modrinth-facing
    // number + display name carry the MC tag, so Forge-1.20.1 and NeoForge-1.21.1
    // never collide. → e.g. "1.20.1-0.1.5".
    version = "${minecraft_version}-${mod_version}"
    displayName = "[Forge ${minecraft_version}] ${mod_name} ${mod_version}"

    // Latest CHANGELOG.md entry — it lives at the repo root, one level up from
    // this standalone Forge/ subproject.
    changelog = providers.provider {
        def f = file('../CHANGELOG.md')
        if (!f.exists()) return "See https://github.com/RandomCodeGuys/create-ore-excavation-deposits/commits/1.20.1 for changes."
        def text = f.text
        def matcher = text =~ /(?s)## .*?(?=\n## |\z)/
        return matcher.find() ? matcher.group(0).trim() : text
    }

    // ALPHA while the 1.20.1 port is still iterating (worldgen/CODEC/RNG may shift).
    type = ALPHA
    modLoaders.add("forge")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        // Same project as NeoForge — the MC-prefixed version number (above) keeps
        // the two lines' versions distinct.
        projectId = "XfN8l56o"
        minecraftVersions.add(minecraft_version)  // 1.20.1 (from gradle.properties)

        requires {
            slug = "create-ore-excavation"
        }
        optional {
            slug = "xaeros-world-map"
        }
        optional {
            slug = "xaeros-minimap"
        }
        optional {
            slug = "yacl"
        }
    }
}

// ── CRITICAL: publish MUST ship the reobfuscated jar ────────────────────────
// `publishMods`/`publishModrinth` depend on `jar` (which ALONE produces a RAW,
// Mojang-named jar) but NOT on `reobfJar`. The release workflow runs `build`
// then a SEPARATE `publishMods`, and that second invocation re-runs `jar`
// un-reobfuscated, overwriting the good jar from `build` → an un-reobf'd jar
// was uploaded to both Modrinth and GitHub for 0.1.5 and crashed on the SRG
// runtime: NoSuchMethodError FileToIdConverter.json (the Mojang name). Force
// reobf to run before any publish task reads tasks.jar.archiveFile.
tasks.matching { it.name == 'publishMods' || it.name == 'publishModrinth' }.configureEach {
    dependsOn 'reobfJar'
}
