modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# Mixin config — world-map overlay injection into Xaero's GuiMap (client-only).
[[mixins]]
    config="coedeposits.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Host mod — coedeposits extends Create Ore Excavation; must load AFTER it.
[[dependencies.${mod_id}]]
    modId="createoreexcavation"
    mandatory=true
    versionRange="[1.6,)"
    ordering="AFTER"
    side="BOTH"

# Create — COE's own hard dependency; declared so load order is deterministic.
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="[0.5.1,)"
    ordering="AFTER"
    side="BOTH"
