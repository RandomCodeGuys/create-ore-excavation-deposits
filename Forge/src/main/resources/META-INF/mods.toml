modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# Mixin config — world-map overlay injection into Xaero's GuiMap (client-only).
[[mixins]]
    config="coedeposits.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Host mod — coedeposits extends Create Ore Excavation; must load AFTER it.
[[dependencies.${mod_id}]]
    modId="createoreexcavation"
    mandatory=true
    versionRange="[1.6,)"
    ordering="AFTER"
    side="BOTH"

# Create — COE's own hard dependency (COE 1.6.5 requires create [6.0.2,)).
# Create 6.0 ships for 1.20.1 too (decoupled versioning).
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="[6.0.2,)"
    ordering="AFTER"
    side="BOTH"

# KubeJS — OPTIONAL script integration (the CoeDeposits binding for defining deposit
# types from scripts). Load AFTER it so kubejs.plugins.txt is picked up when present;
# absent = the plugin is never discovered and the mod runs fine without it.
[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=false
    versionRange="[2001.6,)"
    ordering="AFTER"
    side="BOTH"
